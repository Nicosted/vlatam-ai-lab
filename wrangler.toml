name = "vlatam-ai-lab-api"
main = "src/worker/index.ts"
compatibility_date = "2024-06-01"
compatibility_flags = ["nodejs_compat"]

# Bindings will be added after KV namespace creation
[[kv_namespaces]]
binding = "NORMATIVE_KV"
id = "0dd29a9bcfcd4bf9b3e6dce6fb5fe5e9"
preview_id = "0dd29a9bcfcd4bf9b3e6dce6fb5fe5e9"

[vars]
ENVIRONMENT = "production"
CLOUDFLARE_PIPELINE_V1_ENABLED = "false"

# API auth token will be set as secret
# pnpm wrangler secret put API_AUTH_TOKEN

[[vectorize]]
binding = "ARCA_EMBEDDINGS"
index_name = "arca-embeddings"

[[vectorize]]
binding = "INFOLEG_EMBEDDINGS"
index_name = "infoleg-embeddings"

[[vectorize]]
binding = "VUCE_EMBEDDINGS"
index_name = "vuce-embeddings"

[ai]
binding = "AI"

[[r2_buckets]]
binding = "REGULATORY_DOCS"
bucket_name = "regulatory-documents"
preview_bucket_name = "regulatory-documents-preview"

[[queues.producers]]
binding = "EMBEDDING_QUEUE"
queue = "embedding-queue"

[[queues.producers]]
binding = "PARSING_QUEUE"
queue = "parsing-queue"

[[queues.consumers]]
queue = "embedding-queue"
max_batch_size = 20
max_batch_timeout = 5

[[workflows]]
binding = "PCRAM_WORKFLOW"
name = "pcram-pipeline"
class_name = "PCRAMPipeline"
